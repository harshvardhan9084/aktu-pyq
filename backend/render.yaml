services:
  - type: web
    name: aktu-pyq-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    # System packages (tesseract, poppler) must be added in Render Dashboard
    # Settings → Build & Deploy → "Packages" field → add: tesseract-ocr poppler-utils
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_API_TOKEN
        sync: false
      - key: CHROMA_PERSIST_PATH
        value: ./chroma_db
