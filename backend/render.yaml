services:
  - type: web
    name: aktu-pyq-backend
    env: python
    rootDir: backend
    pythonVersion: "3.11.9"
    buildCommand: >
      pip install --upgrade pip &&
      pip install --extra-index-url https://download.pytorch.org/whl/cpu
      -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_API_TOKEN
        sync: false
      - key: CHROMA_PERSIST_PATH
        value: ./chroma_db