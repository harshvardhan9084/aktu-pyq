services:
  - type: web
    name: aktu-pyq-backend
    env: python
    rootDir: backend
    buildCommand: apt-get update && apt-get install -y --no-install-recommends poppler-utils tesseract-ocr && pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_API_TOKEN
        sync: false
